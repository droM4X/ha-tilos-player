play:
  name: Play
  description: >-
    Play the selected archive episode, a direct mp3 URL, or the live stream on
    the given media player, and apply the Tilos metadata (title, show name,
    cover) to it.
  fields:
    entity_id:
      name: Media player
      description: The media player to play on.
      required: true
      selector:
        entity:
          domain: media_player
    media:
      name: Media
      description: >-
        Play the selected archive episode, a direct mp3 URL (the `url` field),
        or the live stream.
      required: false
      default: episode
      selector:
        select:
          options:
            - value: episode
              label: Selected episode
            - value: url
              label: Direct mp3 URL
            - value: live
              label: Live stream
    url:
      name: URL
      description: >-
        Direct mp3 URL to play. Only used when media is set to "url". Any mp3
        URL is accepted, not only Tilos archive links.
      required: false
      example: "https://stream.tilos.hu/archive/example.mp3"
      selector:
        text:
          type: url
    enqueue:
      name: Enqueue
      description: >-
        Only for Music Assistant players. When set, the episode is queued
        instead of played directly. Leave empty for a plain Home Assistant
        media player.
      required: false
      selector:
        select:
          options:
            - value: play
              label: Play now (keep queue)
            - value: add
              label: Add to queue
            - value: next
              label: Play next
            - value: replace
              label: Replace queue and play
            - value: replace_next
              label: Replace queue and play next

